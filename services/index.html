<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Status dos serviços · StoreApps</title>
    <meta name="description" content="Situação dos produtos da StoreApps: VumboraLá, Hub Gamers, Ôxe Sushi e Querido Delivery." />
    <link rel="icon" href="../favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="../img/storeapps-favicon-v2.svg" />
    <style>
      @font-face {
        font-family: Rubik;
        src: url("../img/Rubik.ttf") format("truetype");
        font-weight: 300 900;
        font-display: swap;
      }
      /* Página pública: uma linha por produto, no azul-marinho da StoreApps. */
      :root {
        color-scheme: dark;
        --bg: #050b26;
        --panel: #0a1438;
        --line: #1c2a5c;
        --ink: #f2f6ff;
        --muted: #9aa8cc;
        --accent: #3b74ff;
        --ok: #12c98a;
        --warn: #f5c400;
        --down: #ff5c5c;
        --none: #1a2650;
        --f-display: Rubik, system-ui, sans-serif;
        --f-body: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f2f6ff;
          --panel: #ffffff;
          --line: #dae4f5;
          --ink: #07143e;
          --muted: #536584;
          --accent: #0646ed;
          --ok: #0aa874;
          --warn: #d9a400;
          --down: #e03a3a;
          --none: #e3e9f6;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--f-body);
        line-height: 1.5;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-block: 0 56px;
      }
      a { color: inherit; }
      .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 22px; }
      .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 18px 6px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
      .brand img { width: 34px; height: 34px; }
      .brand span span { color: var(--accent); }
      .topbar .back { font-size: 0.88rem; color: var(--muted); text-decoration: none; }
      .topbar .back:hover { color: var(--ink); }
      header.hero { text-align: center; display: grid; gap: 10px; justify-items: center; padding-block: 18px 6px; }
      h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.9rem, 4.6vw, 2.6rem); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
      .geral { display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
      .geral i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
      .geral.ok i { background: var(--ok); } .geral.warn i { background: var(--warn); } .geral.down i { background: var(--down); }
      .updated { font-size: 0.82rem; color: var(--muted); }
      .lista { display: grid; gap: 14px; }
      .produto { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
      .p-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .p-logo { width: 30px; height: 30px; border-radius: 8px; object-fit: contain; background: #fff; flex: none; }
      .p-ini { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 0.8rem; color: #fff; flex: none; }
      .p-nome { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; min-width: 0; }
      .p-st { margin-left: auto; font-size: 0.9rem; font-weight: 600; white-space: nowrap; color: var(--muted); }
      .p-st.ok { color: var(--ok); } .p-st.warn { color: var(--warn); } .p-st.down { color: var(--down); }
      .bars { display: flex; gap: 3px; height: 30px; }
      .bars i { flex: 1 1 0; min-width: 2px; border-radius: 3px; background: var(--none); }
      .bars i.ok { background: var(--ok); } .bars i.warn { background: var(--warn); } .bars i.down { background: var(--down); }
      .axis { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .empty { color: var(--muted); text-align: center; padding: 28px; border: 1px dashed var(--line); border-radius: 12px; }
      .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); }
      .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
      footer { text-align: center; color: var(--muted); font-size: 0.82rem; display: grid; gap: 4px; }
      footer a { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="../" aria-label="StoreApps, voltar ao site"><img src="../img/storeapps-favicon-v2.svg" alt="" width="34" height="34" /><span>Store<span>Apps</span></span></a>
        <a class="back" href="../">Voltar ao site</a>
      </div>

      <header class="hero">
        <h1>Status dos serviços</h1>
        <span class="geral" id="geral"><i aria-hidden="true"></i><span id="geral-txt">Carregando…</span></span>
        <span class="updated" id="updated">Verificado a cada 5 minutos.</span>
      </header>

      <div class="lista" id="lista"><div class="empty">Carregando a situação dos produtos…</div></div>

      <div class="legend" aria-label="Legenda das barras">
        <span><i style="background: var(--ok)"></i>No ar o dia todo</span>
        <span><i style="background: var(--warn)"></i>Instabilidade</span>
        <span><i style="background: var(--down)"></i>Fora do ar</span>
        <span><i style="background: var(--none)"></i>Sem dados</span>
      </div>

      <footer>
        <span>Cada barra é um dia (horário de Brasília).</span>
        <span>© StoreApps Tecnologia</span>
      </footer>
    </div>

    <script>
      (function () {
        var STATUS_URL = "https://status.storeapps.com.br/status";
        var LOGOS = { vumborala: "../img/status/vumborala.png", hubgamers: "../img/hubgamers-oficial.png", storeapps: "../img/storeapps-favicon-v2.svg", oxe: "../img/status/oxe-sushi.png" };
        var INICIAIS = { querido: ["QD", "#d9363e"] };
        var ESTADO = { operacional: ["ok", "Operacional"], instavel: ["warn", "Instabilidade"], fora: ["down", "Fora do ar"] };
        var lista = document.getElementById("lista");
        var dados = null;

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
        function diaBR(d) { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo", year: "numeric", month: "2-digit", day: "2-digit" }).format(d); }
        function rotuloDia(k) { var p = k.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
        function quantosDias() { var w = lista.clientWidth || 900; return w < 520 ? 30 : w < 820 ? 60 : 90; }
        function tempoRelativo(ms) {
          var min = Math.round((Date.now() - ms) / 60000);
          if (min < 1) return "agora há pouco";
          if (min < 60) return "há " + min + " min";
          var h = Math.round(min / 60);
          return h < 24 ? "há " + h + " h" : "há " + Math.round(h / 24) + " dia(s)";
        }

        function render() {
          if (!dados) return;
          var nd = quantosDias(), hoje = new Date(), chaves = [];
          for (var i = nd - 1; i >= 0; i--) chaves.push(diaBR(new Date(hoje.getTime() - i * 86400000)));
          var pior = 0;
          var html = dados.produtos.map(function (p) {
            var e = ESTADO[p.estado] || ["", "Aguardando verificação"];
            pior = Math.max(pior, e[0] === "down" ? 2 : e[0] === "warn" ? 1 : 0);
            var logo = LOGOS[p.id]
              ? '<img class="p-logo" src="' + LOGOS[p.id] + '" alt="" width="30" height="30" />'
              : '<span class="p-ini" style="background:' + (INICIAIS[p.id] || ["?", "#3b74ff"])[1] + '" aria-hidden="true">' + (INICIAIS[p.id] || ["?"])[0] + "</span>";
            var barras = chaves.map(function (k) { var c = p.dias[k] || ""; return '<i class="' + c + '" title="' + rotuloDia(k) + '"></i>'; }).join("");
            var disp = p.disponibilidade == null ? "" : String(p.disponibilidade.toFixed(2)).replace(".", ",") + "% no ar";
            return '<section class="produto"><div class="p-h">' + logo + '<span class="p-nome">' + esc(p.nome) + '</span><span class="p-st ' + e[0] + '">' + e[1] + "</span></div>" +
              '<div class="bars" role="img" aria-label="Últimos ' + nd + " dias de " + esc(p.nome) + '">' + barras + "</div>" +
              '<div class="axis"><span>' + nd + " dias atrás</span><span>" + disp + "</span><span>Hoje</span></div></section>";
          }).join("");
          lista.innerHTML = html || '<div class="empty">Nenhum produto para mostrar agora.</div>';
          var g = document.getElementById("geral");
          g.className = "geral " + ["ok", "warn", "down"][pior];
          document.getElementById("geral-txt").textContent = ["Todos os produtos operando normalmente", "Algum produto com instabilidade", "Algum produto fora do ar"][pior];
          document.getElementById("updated").textContent = dados.atualizado ? "Última verificação " + tempoRelativo(dados.atualizado) + " · verificado a cada 5 minutos." : "Aguardando a primeira verificação.";
        }

        function carregar() {
          fetch(STATUS_URL, { cache: "no-store" })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (j) { if (!j || !Array.isArray(j.produtos)) throw new Error("formato"); dados = j; render(); })
            .catch(function () {
              if (!dados) lista.innerHTML = '<div class="empty">Não deu para carregar a situação agora. A página tenta de novo em 1 minuto.</div>';
            });
        }
        var larguraAntes = 0;
        window.addEventListener("resize", function () { var w = quantosDias(); if (w !== larguraAntes) { larguraAntes = w; render(); } });
        carregar();
        setInterval(carregar, 60000);
      })();
    </script>
  </body>
</html>
