# Worker da página de status (storeapps.com.br/services).
# Publicar: npx wrangler@4 deploy   (a conta é a da StoreApps na Cloudflare)
name = "storeapps-status"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATUS"
id = "e092b0c3e28242afa623090031eb1cd2"

[observability]
enabled = true
